services:
  aidbg-logs:
    profiles: ["logs"]
    build:
      context: .
      dockerfile: modules/logs/Dockerfile
    container_name: aidbg-logs
    restart: unless-stopped
    expose:
      - "8091"
      - "8092"
    environment:
      AIDBG_LOG_CONFIG: "/etc/aidbg/logs.yaml"
      AIDBG_LOG_GRPC_BIND: "0.0.0.0:8091"
      AIDBG_LOG_HEALTH_BIND: "0.0.0.0:8092"
      AIDBG_LOG_SERVICE_TOKEN: "${AIDBG_LOG_SERVICE_TOKEN:-}"
      AIDBG_LOG_TLS_CERT: "${AIDBG_LOG_TLS_CERT:-}"
      AIDBG_LOG_TLS_KEY: "${AIDBG_LOG_TLS_KEY:-}"
    env_file:
      - path: "${AIDBG_LOG_ENV_FILE:-./modules/logs/provider.env}"
        required: false
    volumes:
      - "${AIDBG_LOG_CONFIG_FILE:-./modules/logs/config.empty.yaml}:/etc/aidbg/logs.yaml:ro"

  aidbg-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aidbg-backend
    restart: unless-stopped
    ports:
      - "4317:4317"
      - "8088:8088"
    environment:
      AIDBG_OTLP_GRPC_BIND: "0.0.0.0:4317"
      AIDBG_HTTP_BIND: "0.0.0.0:8088"
      AIDBG_CURRENT_WINDOW_S: "300"
      AIDBG_BASELINE_WINDOW_S: "900"
      AIDBG_LOG_SERVICE_GRPC: "${AIDBG_LOG_SERVICE_GRPC:-aidbg-logs:8091}"
      AIDBG_LOG_SERVICE_TOKEN: "${AIDBG_LOG_SERVICE_TOKEN:-}"
      AIDBG_LOG_API_TOKEN: "${AIDBG_LOG_API_TOKEN:-}"
      AIDBG_ADMIN_API_TOKEN: "${AIDBG_ADMIN_API_TOKEN:-}"
      AIDBG_CHANGE_INGEST_TOKEN: "${AIDBG_CHANGE_INGEST_TOKEN:-}"
      AIDBG_GITHUB_WEBHOOK_SECRET: "${AIDBG_GITHUB_WEBHOOK_SECRET:-}"
      AIDBG_LOG_TLS_CA: "${AIDBG_LOG_TLS_CA:-}"
      AIDBG_LOG_TLS_SERVER_NAME: "${AIDBG_LOG_TLS_SERVER_NAME:-}"
      AIDBG_K8S_AGENT_TOKEN: "${AIDBG_K8S_AGENT_TOKEN:-}"
      AIDBG_K8S_RETENTION_EVENTS: "${AIDBG_K8S_RETENTION_EVENTS:-5000}"
      AIDBG_INCIDENT_RETENTION: "${AIDBG_INCIDENT_RETENTION:-500}"
      AIDBG_MASTER_KEY: "${AIDBG_MASTER_KEY:-}"
      AIDBG_CONTROL_DB: "/data/aidbg-control.db"
      AIDBG_CONTROL_DATABASE_URL: "${AIDBG_CONTROL_DATABASE_URL:-}"
      AIDBG_EVENT_TRANSPORT: "${AIDBG_EVENT_TRANSPORT:-database}"
      AIDBG_KAFKA_BOOTSTRAP_SERVERS: "${AIDBG_KAFKA_BOOTSTRAP_SERVERS:-}"
      AIDBG_KAFKA_K8S_TOPIC: "${AIDBG_KAFKA_K8S_TOPIC:-quellops.kubernetes.events.v1}"
      AIDBG_KAFKA_CONSUMER_GROUP: "${AIDBG_KAFKA_CONSUMER_GROUP:-quellops-central-v1}"
      AIDBG_KAFKA_CONSUMER_EMBEDDED: "${AIDBG_KAFKA_CONSUMER_EMBEDDED:-false}"
      AIDBG_KAFKA_SECURITY_PROTOCOL: "${AIDBG_KAFKA_SECURITY_PROTOCOL:-}"
      AIDBG_KAFKA_SASL_MECHANISM: "${AIDBG_KAFKA_SASL_MECHANISM:-}"
      AIDBG_KAFKA_SASL_USERNAME: "${AIDBG_KAFKA_SASL_USERNAME:-}"
      AIDBG_KAFKA_SASL_PASSWORD: "${AIDBG_KAFKA_SASL_PASSWORD:-}"
      AIDBG_KAFKA_SSL_CA_LOCATION: "${AIDBG_KAFKA_SSL_CA_LOCATION:-}"
      # Optional: enable /explain/latest + UI insights (see docs/LLM_SETUP.md)
      AZURE_OPENAI_ENDPOINT: "${AZURE_OPENAI_ENDPOINT:-}"
      AZURE_OPENAI_API_KEY: "${AZURE_OPENAI_API_KEY:-}"
      AZURE_OPENAI_DEPLOYMENT: "${AZURE_OPENAI_DEPLOYMENT:-}"
      AZURE_OPENAI_API_VERSION: "${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}"
    volumes:
      - aidbg-control:/data

  aidbg-kafka-worker:
    profiles: ["kafka"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aidbg-kafka-worker
    command: ["python", "-m", "aidbg.kafka_worker"]
    restart: unless-stopped
    environment:
      AIDBG_CONTROL_DB: "/data/aidbg-control.db"
      AIDBG_CONTROL_DATABASE_URL: "${AIDBG_CONTROL_DATABASE_URL:-}"
      AIDBG_EVENT_TRANSPORT: "kafka"
      AIDBG_INCIDENT_RETENTION: "${AIDBG_INCIDENT_RETENTION:-500}"
      AIDBG_CURRENT_WINDOW_S: "300"
      AIDBG_BASELINE_WINDOW_S: "900"
      AIDBG_KAFKA_BOOTSTRAP_SERVERS: "${AIDBG_KAFKA_BOOTSTRAP_SERVERS:-quellops-redpanda:9092}"
      AIDBG_KAFKA_K8S_TOPIC: "${AIDBG_KAFKA_K8S_TOPIC:-quellops.kubernetes.events.v1}"
      AIDBG_KAFKA_CONSUMER_GROUP: "${AIDBG_KAFKA_CONSUMER_GROUP:-quellops-central-v1}"
      AIDBG_KAFKA_SECURITY_PROTOCOL: "${AIDBG_KAFKA_SECURITY_PROTOCOL:-}"
      AIDBG_KAFKA_SASL_MECHANISM: "${AIDBG_KAFKA_SASL_MECHANISM:-}"
      AIDBG_KAFKA_SASL_USERNAME: "${AIDBG_KAFKA_SASL_USERNAME:-}"
      AIDBG_KAFKA_SASL_PASSWORD: "${AIDBG_KAFKA_SASL_PASSWORD:-}"
      AIDBG_KAFKA_SSL_CA_LOCATION: "${AIDBG_KAFKA_SSL_CA_LOCATION:-}"
    volumes:
      - aidbg-control:/data
    depends_on:
      quellops-redpanda:
        condition: service_healthy

  aidbg-postgres:
    profiles: ["postgres"]
    image: postgres:17-alpine
    container_name: aidbg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aidbg
      POSTGRES_USER: aidbg
      POSTGRES_PASSWORD: "${AIDBG_POSTGRES_PASSWORD:-aidbg-local-postgres}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidbg -d aidbg"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - aidbg-postgres:/var/lib/postgresql/data

  quellops-redpanda:
    profiles: ["kafka"]
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.6
    container_name: quellops-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://quellops-redpanda:9092,external://localhost:19092
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - quellops-redpanda:33145
    ports:
      - "19092:19092"
      - "19644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy: *true'"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - quellops-redpanda:/var/lib/redpanda/data

volumes:
  aidbg-control:
  aidbg-postgres:
  quellops-redpanda:
