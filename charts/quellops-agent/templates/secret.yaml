{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quellops-agent.fullname" . }}
  labels:
    {{- include "quellops-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  bootstrap-token: {{ required "credentials.bootstrapToken is required when existingSecret is empty" .Values.credentials.bootstrapToken | quote }}
  cluster-token: {{ .Values.credentials.clusterToken | quote }}
{{- end }}

