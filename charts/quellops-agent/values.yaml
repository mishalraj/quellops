image:
  repository: ghcr.io/mishalraj/quellops-kubernetes-agent
  tag: "0.3.0"
  pullPolicy: IfNotPresent

# The Kubernetes API limits the agent to these namespaces. The portal can choose
# a subset to send to QuellOps. Use ["*"] only when cluster-wide discovery and
# node-pressure monitoring are intentionally required.
watchNamespaces:
  - default

controlPlaneURL: "http://quellops:8088"
clusterID: ""
clusterName: ""

credentials:
  existingSecret: ""
  bootstrapToken: ""
  clusterToken: ""

queue:
  limit: 10000
  path: /var/lib/quellops-agent/events.json

persistence:
  enabled: true
  size: 256Mi
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  annotations:
    helm.sh/resource-policy: keep

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
