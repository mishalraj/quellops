services:
  postgres-primary:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: root-test
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10", "-c", "hot_standby=on"]
    volumes:
      - ./postgres-primary-init.sql:/docker-entrypoint-initdb.d/10-replication.sql:ro
      - ./postgres-primary-hba.sh:/docker-entrypoint-initdb.d/20-replication-hba.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 60
  postgres-replica:
    image: postgres:17-alpine
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    entrypoint: ["/usr/local/bin/postgres-replica-entrypoint.sh"]
    volumes:
      - ./postgres-replica-entrypoint.sh:/usr/local/bin/postgres-replica-entrypoint.sh:ro
    depends_on:
      postgres-primary: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 60
  mysql-primary:
    image: mysql:8.4
    environment: {MYSQL_ROOT_PASSWORD: root-test}
    command: ["--server-id=1", "--log-bin=mysql-bin", "--binlog-format=ROW", "--gtid-mode=ON", "--enforce-gtid-consistency=ON"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot-test"]
      interval: 2s
      timeout: 3s
      retries: 60
  mysql-replica:
    image: mysql:8.4
    environment: {MYSQL_ROOT_PASSWORD: root-test}
    command: ["--server-id=2", "--log-bin=mysql-bin", "--relay-log=relay-bin", "--binlog-format=ROW", "--gtid-mode=ON", "--enforce-gtid-consistency=ON"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot-test"]
      interval: 2s
      timeout: 3s
      retries: 60
  mongo-1:
    image: mongo:8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
  mongo-2:
    image: mongo:8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
  mongo-3:
    image: mongo:8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
  redis-primary:
    image: redis:7-alpine
  redis-replica:
    image: redis:7-alpine
    command: ["redis-server", "--replicaof", "redis-primary", "6379", "--replica-read-only", "yes"]
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.6
    command: ["redpanda", "start", "--mode", "dev-container", "--smp", "1", "--kafka-addr", "0.0.0.0:9092", "--advertise-kafka-addr", "redpanda:9092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy: *true'"]
      interval: 3s
      timeout: 5s
      retries: 60
  debezium:
    image: quay.io/debezium/connect:3.3
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: quellops-database-integration
      CONFIG_STORAGE_TOPIC: quellops.dbtest.config
      OFFSET_STORAGE_TOPIC: quellops.dbtest.offsets
      STATUS_STORAGE_TOPIC: quellops.dbtest.status
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m
    depends_on:
      redpanda: {condition: service_healthy}
  validator:
    build:
      context: ../../..
      dockerfile: backend/Dockerfile
    profiles: ["validator"]
    environment: {PYTHONPATH: /workspace/backend/src}
    volumes: ["../../..:/workspace:ro"]
    command: ["python", "/workspace/tests/integration/database/validate.py", "replicas"]
  control-postgres:
    image: postgres:17-alpine
    profiles: ["soak"]
    environment:
      POSTGRES_DB: quellops
      POSTGRES_USER: quellops
      POSTGRES_PASSWORD: soak-test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quellops -d quellops"]
      interval: 2s
      timeout: 3s
      retries: 60
  soak:
    build:
      context: ../../..
      dockerfile: backend/Dockerfile
    profiles: ["soak"]
    environment:
      PYTHONPATH: /workspace/backend/src
      DATABASE_TEST_URL: postgresql://quellops:soak-test@control-postgres:5432/quellops
      DATABASE_SOAK_SECONDS: ${DATABASE_SOAK_SECONDS:-180}
      DATABASE_SOAK_SOURCES: ${DATABASE_SOAK_SOURCES:-12}
    volumes: ["../../..:/workspace:ro"]
    command: ["python", "/workspace/tests/database_multi_replica_soak.py"]
    depends_on:
      control-postgres: {condition: service_healthy}
