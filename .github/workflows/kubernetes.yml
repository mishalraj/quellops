name: Kubernetes module

on:
  pull_request:
    paths: ["agent/**", "backend/**", "tests/test_k8s_*.py", "tests/test_kafka_*.py", "tests/test_incident_store.py", "charts/quellops-agent/**", "docker-compose.yml", ".github/workflows/kubernetes.yml"]
  push:
    branches: [main]
    paths: ["agent/**", "backend/**", "tests/test_k8s_*.py", "tests/test_kafka_*.py", "tests/test_incident_store.py", "charts/quellops-agent/**", "docker-compose.yml", ".github/workflows/kubernetes.yml"]

permissions:
  contents: read
  packages: write

jobs:
  test-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: go test ./...
        working-directory: agent
      - run: test -z "$(gofmt -l .)"
        working-directory: agent
      - run: go vet ./...
        working-directory: agent
      - uses: azure/setup-helm@v4
      - run: helm lint charts/quellops-agent --set controlPlaneURL=http://example --set clusterID=test --set credentials.bootstrapToken=test
      - run: docker compose config --quiet
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python -m unittest tests.test_k8s_control tests.test_kafka_transport tests.test_incident_store
        env:
          PYTHONPATH: backend/src

  publish-agent:
    if: github.event_name == 'push'
    needs: test-agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: agent
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/quellops-kubernetes-agent:latest
            ghcr.io/${{ github.repository_owner }}/quellops-kubernetes-agent:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/quellops-kubernetes-agent:${{ github.ref_name }}
