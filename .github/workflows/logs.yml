name: Logs module

on:
  push:
    paths:
      - "modules/logs/**"
      - "backend/**"
      - "tests/**"
      - ".github/workflows/logs.yml"
  pull_request:
    paths:
      - "modules/logs/**"
      - "backend/**"
      - "tests/**"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aidbg_test
          POSTGRES_USER: aidbg
          POSTGRES_PASSWORD: aidbg-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aidbg -d aidbg_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: modules/logs/go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: go test ./...
        working-directory: modules/logs
      - run: test -z "$(gofmt -l .)"
        working-directory: modules/logs
      - run: go vet ./...
        working-directory: modules/logs
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: ruff check --no-cache backend/src/aidbg tests demo/tools demo/services
      - run: ruff format --check --no-cache backend/src/aidbg tests demo/tools demo/services
      - run: python -m unittest discover -s tests
        env:
          PYTHONPATH: backend/src
          AIDBG_TEST_POSTGRES_URL: postgresql://aidbg:aidbg-test-password@127.0.0.1:5432/aidbg_test
      - run: docker compose config --quiet
