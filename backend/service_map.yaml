# Map repository paths to demo service entities for code.push correlation.
mappings:
  - pattern: "demo/services/inventory/**"
    service: inventory
  - pattern: "demo/services/catalog/**"
    service: catalog
  - pattern: "demo/services/checkout/**"
    service: checkout
  - pattern: "demo/services/edge/**"
    service: edge
  - pattern: "deploy/quellops-demo/inventory.yaml"
    service: inventory
  - pattern: "deploy/quellops-demo/catalog.yaml"
    service: catalog
  - pattern: "deploy/quellops-demo/checkout.yaml"
    service: checkout
  - pattern: "deploy/quellops-demo/edge.yaml"
    service: edge
