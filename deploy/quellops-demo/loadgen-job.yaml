apiVersion: batch/v1
kind: Job
metadata:
  name: quellops-demo-loadgen
  namespace: quellops-demo
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: loadgen
          image: quellops-demo/loadgen:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: EDGE_URL
              value: http://edge.quellops-demo.svc.cluster.local:8080/
            - name: DURATION_SECONDS
              value: "90"
            - name: RPS
              value: "10"
