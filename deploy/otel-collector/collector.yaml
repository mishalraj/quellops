apiVersion: v1
kind: Namespace
metadata:
  name: aidbg-otel
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aidbg-otel-collector-config
  namespace: aidbg-otel
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:

    exporters:
      otlp:
        endpoint: ${AIDBG_BACKEND_OTLP_ENDPOINT}
        tls:
          insecure: true

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aidbg-otel-collector
  namespace: aidbg-otel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aidbg-otel-collector
  template:
    metadata:
      labels:
        app: aidbg-otel-collector
    spec:
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector-contrib:0.131.0
          args: ["--config=/conf/collector.yaml"]
          env:
            - name: AIDBG_BACKEND_OTLP_ENDPOINT
              # Local-only default: backend runs on host via Docker Compose.
              # host.docker.internal is portable on Docker Desktop (Windows/macOS).
              value: "host.docker.internal:4317"
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          volumeMounts:
            - name: conf
              mountPath: /conf
      volumes:
        - name: conf
          configMap:
            name: aidbg-otel-collector-config
            items:
              - key: collector.yaml
                path: collector.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: aidbg-otel-collector
  namespace: aidbg-otel
spec:
  selector:
    app: aidbg-otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318

