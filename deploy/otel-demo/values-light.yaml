# Light profile for `open-telemetry/opentelemetry-demo` on small local Kind clusters.
# Goal: keep enough microservices to produce distributed traces, while removing the
# largest memory consumers and optional UI stacks.

# Disable heavy optional stacks
jaeger:
  enabled: false

prometheus:
  enabled: false

grafana:
  enabled: false

opensearch:
  enabled: false

# Disable Kafka + Accounting (accounting waits for kafka)
components:
  kafka:
    enabled: false
  accounting:
    enabled: false

# Demo workloads send OTLP to the in-namespace `otel-collector` service. Without an
# extra exporter, nothing reaches `quellops-otel-collector` or the local backend, so
# `/stats/ingest` stays at zero. Forward traces into the aidbg pipeline (which then
# exports to the host backend — see `deploy/otel-collector/collector.yaml`).
opentelemetry-collector:
  config:
    exporters:
      otlp/aidbg:
        endpoint: quellops-otel-collector.quellops-otel.svc.cluster.local:4317
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          exporters: [otlp/aidbg, debug, spanmetrics]

