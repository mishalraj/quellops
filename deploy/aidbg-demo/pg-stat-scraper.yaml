apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-stat-scraper
  namespace: aidbg-demo
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: scraper
              image: aidbg-demo/inventory:dev
              imagePullPolicy: IfNotPresent
              command:
                - python
                - /app/tools/pg_stat_scraper.py
              env:
                - name: DATABASE_URL
                  value: postgresql://aidbg:aidbg@postgres.aidbg-demo.svc.cluster.local:5432/aidbg
                - name: AIDBG_CHANGE_INGEST_URL
                  value: http://172.18.0.1:8088/ingest/change
                - name: PG_STAT_ENTITY
                  value: inventory
                - name: PG_STAT_MIN_MEAN_MS
                  value: "1"
