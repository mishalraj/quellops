apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: aidbg-demo
data:
  init.sql: |
    CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
    GRANT pg_read_all_stats TO aidbg;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: aidbg-demo
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: aidbg-demo
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: aidbg
            - name: POSTGRES_PASSWORD
              value: aidbg
            - name: POSTGRES_DB
              value: aidbg
          args:
            - "-c"
            - "shared_preload_libraries=pg_stat_statements"
            - "-c"
            - "pg_stat_statements.track=all"
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "aidbg"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: init
          configMap:
            name: postgres-init
