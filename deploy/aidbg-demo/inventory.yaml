apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: aidbg-demo
  labels:
    app: inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
        - name: inventory
          image: aidbg-demo/inventory:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: inventory
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://aidbg-otel-collector.aidbg-otel.svc.cluster.local:4317
            - name: DOWNSTREAM_URL
              value: http://catalog.aidbg-demo.svc.cluster.local:8080
            - name: DATABASE_URL
              value: postgresql://aidbg:aidbg@postgres.aidbg-demo.svc.cluster.local:5432/aidbg
            - name: AIDBG_CHANGE_INGEST_URL
              value: http://172.18.0.1:8088/ingest/change
            - name: AIDBG_NAMESPACE
              value: aidbg-demo
            - name: FAULT_LATENCY_MS
              value: "0"
            - name: FAULT_ERROR_RATE
              value: "0"
            - name: FAULT_DB_SLEEP_MS
              value: "0"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: aidbg-demo
spec:
  selector:
    app: inventory
  ports:
    - port: 8080
      targetPort: 8080
