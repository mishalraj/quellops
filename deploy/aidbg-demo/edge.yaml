apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  namespace: aidbg-demo
  labels:
    app: edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge
  template:
    metadata:
      labels:
        app: edge
    spec:
      containers:
        - name: edge
          image: aidbg-demo/edge:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: edge
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://aidbg-otel-collector.aidbg-otel.svc.cluster.local:4317
            - name: DOWNSTREAM_URL
              value: http://checkout.aidbg-demo.svc.cluster.local:8080
            - name: FAULT_LATENCY_MS
              value: "0"
            - name: FAULT_ERROR_RATE
              value: "0"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: edge
  namespace: aidbg-demo
spec:
  selector:
    app: edge
  ports:
    - port: 8080
      targetPort: 8080
