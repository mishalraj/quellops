apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: aidbg-demo
  labels:
    app: catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: aidbg-demo/catalog:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: catalog
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://aidbg-otel-collector.aidbg-otel.svc.cluster.local:4317
            - name: FAULT_LATENCY_MS
              value: "0"
            - name: FAULT_ERROR_RATE
              value: "0"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: aidbg-demo
spec:
  selector:
    app: catalog
  ports:
    - port: 8080
      targetPort: 8080
