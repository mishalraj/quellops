apiVersion: v1
kind: Namespace
metadata:
  name: aidbg-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aidbg-agent
  namespace: aidbg-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aidbg-agent-readonly
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aidbg-agent-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aidbg-agent-readonly
subjects:
  - kind: ServiceAccount
    name: aidbg-agent
    namespace: aidbg-agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aidbg-agent
  namespace: aidbg-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aidbg-agent
  template:
    metadata:
      labels:
        app: aidbg-agent
    spec:
      serviceAccountName: aidbg-agent
      containers:
        - name: agent
          image: ghcr.io/mishalraj/aidbg-kubernetes-agent:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: AIDBG_BACKEND_URL
              value: "http://host.docker.internal:8088"
            - name: AIDBG_CLUSTER_NAME
              value: ""
            - name: AIDBG_K8S_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aidbg-agent-credentials
                  key: token
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
