apiVersion: v1
kind: Namespace
metadata:
  name: quellops-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quellops-agent
  namespace: quellops-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: quellops-agent-readonly
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "events", "nodes", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: quellops-agent-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: quellops-agent-readonly
subjects:
  - kind: ServiceAccount
    name: quellops-agent
    namespace: quellops-agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quellops-agent
  namespace: quellops-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quellops-agent
  template:
    metadata:
      labels:
        app: quellops-agent
    spec:
      serviceAccountName: quellops-agent
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: agent
          image: ghcr.io/mishalraj/quellops-kubernetes-agent:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: AIDBG_BACKEND_URL
              value: "http://host.docker.internal:8088"
            - name: AIDBG_CLUSTER_NAME
              value: ""
            # This legacy manifest intentionally uses cluster-wide discovery.
            # Prefer the Helm chart with an explicit namespace allowlist.
            - name: AIDBG_K8S_ALLOWED_NAMESPACES
              value: "*"
            - name: AIDBG_K8S_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: quellops-agent-credentials
                  key: token
            - name: AIDBG_K8S_CLUSTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: quellops-agent-credentials
                  key: cluster-token
                  optional: true
            - name: AIDBG_K8S_QUEUE_PATH
              value: /var/lib/quellops-agent/events.json
            - name: AIDBG_K8S_TOKEN_PATH
              value: /var/lib/quellops-agent/agent.token
          volumeMounts:
            - name: state
              mountPath: /var/lib/quellops-agent
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: quellops-agent-state
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: quellops-agent-state
  namespace: quellops-agent
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
