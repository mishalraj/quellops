name: db_slowdown
description: >
  Synthetic "change" scenario: annotate + rollout restart of product-catalog.
  Does not inject real DB latency; UI may show recent_deploy and/or traffic_spike,
  not a DB-specific root cause until the ranker models data stores.
target:
  namespace: otel-demo
  deployment: product-catalog
inject:
  type: annotate_placeholder
assert:
  expect_top_types:
    - recent_deploy
    - dependency_unavailable
    - traffic_spike
    - unknown_regression
  allow_top_k: 3
