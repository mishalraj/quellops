name: db_slowdown
description: >
  Real DB slowdown on quellops-demo inventory: migration + pg_sleep + simulated code push.
  Run with scripts/run_demo_scenario.sh 05_db_slowdown (quellops-demo mesh).
target:
  namespace: quellops-demo
  deployment: inventory
inject:
  type: db_slow_query_fault
  fault_db_sleep_ms: 300
  migration: drop_inventory_sku_index
assert:
  expect_top_types:
    - db_slow_query
    - db_migration
  expect_entity: inventory
  allow_top_k: 3
